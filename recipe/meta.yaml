{% set name = "osm2pgrouting" %}
{% set version = "3.0.0" %}

package:
  name: {{ name | lower }}
  version: {{ version }}

source:
  url: https://github.com/pgRouting/osm2pgrouting/archive/v{{ version }}.tar.gz
  sha256: 3d3042aa0dd30930d27801c9833ebfbe16eba0ab0e5d6277636ce17b157f2a0f

build:
  number: 1
  skip: true  # [not linux]
  script:
    - |
      cmake -H. -Bbuild -DCMAKE_INSTALL_PREFIX=$PREFIX
      cd build/
      make 
      make install
  missing_dso_whitelist:
    - /lib64/libm.so.6
    - /lib64/libc.so.6

requirements:
  host:
    - cmake
    - make
    - vcpkg
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - expat
    - libboost-devel
    - libpq
    - libpqxx

  run:

test:
  commands:
    - osm2pgrouting --version

about:
  home: https://github.com/pgRouting/osm2pgrouting
  summary: |
    pgRouting extends the PostGIS / PostgreSQL geospatial database to provide geospatial routing functionality.
  license: GPL-2.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mediocretech
